[package]
name = "decider-desktop"
version = "0.1.0"
description = "Cross-platform voice desktop assistant"
authors = ["Nex2i"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "decider_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sherpa-onnx = "=1.13.8"
cpal = "=0.18.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
sha2 = "=0.11.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
