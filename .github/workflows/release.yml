name: New version (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed to main (for example 0.2.0)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate requested version and source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Run releases from main."; exit 1; }
          node scripts/version.mjs --check
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (version !== process.env.REQUESTED_VERSION) throw new Error('Commit the requested version to main before releasing.');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ncommit=${process.env.GITHUB_SHA}\n`);
          JS
          if git ls-remote --exit-code --tags origin "refs/tags/v$REQUESTED_VERSION"; then
            echo "Version tag already exists; refusing to overwrite it."
            exit 1
          fi
          if gh release view "v$REQUESTED_VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
            artifact: macos-arm64
          - os: windows-latest
            bundle: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: npm ci
      - run: npm test
      - run: npm run check:versions
      - run: npm run format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }} -- --locked
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  publish:
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish requested version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' \) -print0)
          test "${#assets[@]}" -eq 2 || { echo "Expected one installer for each platform."; exit 1; }
          gh release create "v$VERSION" "${assets[@]}" \
            --target "$COMMIT" --title "Decider Desktop $VERSION" \
            --notes "Manually requested development build for macOS (Apple Silicon) and Windows (x64). Installers are not signed/notarized for public distribution yet. Models download separately inside the app."
