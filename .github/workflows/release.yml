name: New version (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed to main (for example 0.2.0)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: manual-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Require Apple release signing configuration
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module <<'JS'
          const required = ['APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY', 'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID'];
          const missing = required.filter(name => !process.env[name]?.trim());
          if (missing.length) throw new Error(`Missing release secrets: ${missing.join(', ')}. See MACOS-SIGNING.md.`);
          if (process.env.APPLE_SIGNING_IDENTITY === '-') throw new Error('Ad-hoc signing is not allowed for releases.');
          JS
      - name: Validate requested version and source
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Run releases from main."; exit 1; }
          node scripts/version.mjs --check
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (version !== process.env.REQUESTED_VERSION) throw new Error('Commit the requested version to main before releasing.');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ncommit=${process.env.GITHUB_SHA}\n`);
          JS
          if git ls-remote --exit-code --tags origin "refs/tags/v$REQUESTED_VERSION"; then
            echo "Version tag already exists; refusing to overwrite it."
            exit 1
          fi
          if gh release view "v$REQUESTED_VERSION" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi
  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
            artifact: macos-arm64
          - os: windows-latest
            bundle: nsis
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: npm ci
      - run: npm test
      - run: npm run check:versions
      - run: npm run format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Import Apple signing certificate into temporary keychain
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          CERTIFICATE_PATH="$RUNNER_TEMP/decider-signing.p12"
          SIGNING_KEYCHAIN="$RUNNER_TEMP/decider-signing.keychain-db"
          trap 'rm -f "$CERTIFICATE_PATH"' EXIT
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync(`${process.env.RUNNER_TEMP}/decider-signing.p12`, Buffer.from(process.env.APPLE_CERTIFICATE, 'base64'), { mode: 0o600 });
          JS
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$CERTIFICATE_PATH" -k "$SIGNING_KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN"
      - name: Build and verify signed, notarized macOS installer
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:macos -- --release
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis -- --locked
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/decider-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/decider-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/decider-signing.p12"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
  publish:
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish requested version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.exe' \) -print0)
          test "${#assets[@]}" -eq 2 || { echo "Expected one installer for each platform."; exit 1; }
          gh release create "v$VERSION" "${assets[@]}" \
            --target "$COMMIT" --title "Decider Desktop $VERSION" \
            --notes "Manually requested build for macOS (Apple Silicon, Apple Developer ID signed and notarized) and Windows (x64, unsigned). Models download separately inside the app."
